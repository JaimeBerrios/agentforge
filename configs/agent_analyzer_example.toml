# Configuración de ejemplo para un agente de análisis de logs en AgentForge

[agent]
id = "log_analyzer_agent"
name = "Log Analyzer Agent"
description = "Agente determinista para parsing, validación y métricas de registros de log."
skills = [
    "log-parser",
    "anomaly-detector",
    "incident-reporter",
]
execution_order = [
    "log-parser",
    "anomaly-detector",
    "incident-reporter",
]

[parameters]
max_events = 10000
strict_mode = true
date_format = "%Y-%m-%d"
